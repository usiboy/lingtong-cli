name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  GO_VERSION: '1.23'
  MODULE_PATH: github.com/lingtong/cli

jobs:
  # Job 1: Code Linting
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: lingtong-cli/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: lingtong-cli
          args: --timeout=5m

      - name: Check formatting
        run: |
          cd lingtong-cli
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

  # Job 2: Unit Tests with Coverage
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: lingtong-cli/go.sum

      - name: Run unit tests with coverage
        run: |
          cd lingtong-cli
          go test -v -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          cd lingtong-cli
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 50" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below threshold of 50%"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lingtong-cli/coverage.out
          retention-days: 30

      - name: Generate coverage HTML report
        run: |
          cd lingtong-cli
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: lingtong-cli/coverage.html
          retention-days: 30

  # Job 3: Documentation Check
  docs-check:
    name: Documentation Validation
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: lingtong-cli/go.sum

      - name: Build CLI
        run: |
          cd lingtong-cli
          make build

      - name: Generate documentation
        run: |
          cd lingtong-cli
          make gen-docs

      - name: Check for uncommitted doc changes
        run: |
          cd lingtong-cli
          if [ -n "$(git status --porcelain doc/commands/)" ]; then
            echo "Documentation is out of date. Please run 'make gen-docs' and commit changes."
            git diff doc/commands/
            exit 1
          fi

      - name: Validate README completeness
        run: |
          cd lingtong-cli
          # Check if command reference table exists
          if ! grep -q "## 命令速查表" README.md; then
            echo "Missing command reference table in README.md"
            exit 1
          fi
          # Check if workflow templates table exists
          if ! grep -q "## 内置工作流模板" README.md; then
            echo "Missing workflow templates documentation in README.md"
            exit 1
          fi

  # Job 4: Integration Tests
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: lingtong-cli/go.sum

      - name: Build CLI
        run: |
          cd lingtong-cli
          make build

      - name: Run integration tests
        run: |
          cd lingtong-cli
          # Test basic CLI functionality
          ./lingtong-cli --help
          ./lingtong-cli version
          ./lingtong-cli auth status || true  # May fail without credentials
          ./lingtong-cli workflow template list
          ./lingtong-cli connector category list

      - name: Test command help output
        run: |
          cd lingtong-cli
          # Verify all main commands have help
          for cmd in workflow connector scene table model auth config api; do
            ./lingtong-cli $cmd --help > /dev/null 2>&1 || {
              echo "Help command failed: $cmd"
              exit 1
            }
          done

  # Job 5: Build for All Platforms
  build-all-platforms:
    name: Cross-Platform Builds
    runs-on: ubuntu-latest
    needs: [unit-test, docs-check]
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: lingtong-cli/go.sum

      - name: Build for ${{ matrix.os }}/${{ matrix.arch }}
        run: |
          cd lingtong-cli
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} make build
          mkdir -p ../artifacts
          if [ "${{ matrix.os }}" = "windows" ]; then
            mv lingtong-cli.exe ../artifacts/lingtong-cli-${{ matrix.os }}-${{ matrix.arch }}.exe
          else
            mv lingtong-cli ../artifacts/lingtong-cli-${{ matrix.os }}-${{ matrix.arch }}
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: lingtong-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/ling*
          retention-days: 30

  # Job 6: Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: lingtong-cli/go.sum

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.20.0
        with:
          args: '-exclude-generated -exclude-dir=vendor ./...'
          working-directory: lingtong-cli

      - name: Check for vulnerable dependencies
        run: |
          cd lingtong-cli
          go list -m -json all | go tool govulncheck || true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            lingtong-cli/gosec-report.sarif
          retention-days: 90

  # Job 7: CI Summary
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [unit-test, integration-test, build-all-platforms, security]
    if: always()
    steps:
      - name: Generate CI Summary
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation | ${{ needs.docs-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cross-Platform Builds | ${{ needs.build-all-platforms.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage reports (30 days retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Platform binaries (30 days retention)" >> $GITHUB_STEP_SUMMARY
          echo "- Security reports (90 days retention)" >> $GITHUB_STEP_SUMMARY
# GitHub Actions CI/CD Workflow for lingtong-cli
          echo "- Security reports (90 days retention)" >> $GITHUB_STEP_SUMMARY
# GitHub Actions CI/CD Workflow for lingtong-cli
