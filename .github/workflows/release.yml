name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "重试已有发布标签，例如 v0.1.1（不创建新版本）"
        required: true
        type: string

permissions:
  contents: read

# 使用同一个队列完成版本分配、GitHub Release 和 npm 发布，避免连续合并时抢占版本。
concurrency:
  group: lingtong-cli-release
  queue: max

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release trigger
        id: trigger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq "any(.[]; .merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"$GITHUB_SHA\")")
            echo "enabled=$merged" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.trigger.outputs.enabled == 'true'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Plan release (read-only)
        if: steps.trigger.outputs.enabled == 'true'
        id: plan
        env:
          REQUESTED_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          cp scripts/release.js "$RUNNER_TEMP/lingtong-release.js"
          node "$RUNNER_TEMP/lingtong-release.js" plan

      - name: Check out exact release commit
        if: steps.trigger.outputs.enabled == 'true' && steps.plan.outputs.published != 'true'
        env:
          RELEASE_COMMIT: ${{ steps.plan.outputs.commit }}
        run: git checkout --detach "$RELEASE_COMMIT"

      - uses: actions/setup-go@v5
        if: steps.trigger.outputs.enabled == 'true' && steps.plan.outputs.published != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before creating a release tag
        if: steps.trigger.outputs.enabled == 'true' && steps.plan.outputs.published != 'true'
        run: |
          go vet ./...
          go test ./...
          npm run test:npm
          make test-dashboard-skill

      - name: Reserve release tag
        if: steps.plan.outputs.createTag == 'true'
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Check reusable GitHub Release
        if: steps.trigger.outputs.enabled == 'true' && steps.plan.outputs.published != 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: node "$RUNNER_TEMP/lingtong-release.js" release-state

      # GITHUB_TOKEN 创建的标签不会触发另一个工作流，所以直接在本流程生成 Release。
      - name: Build and publish GitHub Release
        if: steps.existing.outputs.complete == 'false'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_MAKE_LATEST: ${{ steps.plan.outputs.makeLatest }}

      - name: Prepare matching npm package
        if: steps.trigger.outputs.enabled == 'true' && steps.plan.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          gh release download "$RELEASE_TAG" --pattern checksums.txt --dir .
          node "$RUNNER_TEMP/lingtong-release.js" checksums

      - name: Pack and smoke-test the real npm installer
        if: steps.trigger.outputs.enabled == 'true' && steps.plan.outputs.published != 'true'
        id: package
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/npm-pack.json"
          filename=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/npm-pack.json", "utf8"))[0].filename')
          tarball="$RUNNER_TEMP/$filename"
          npm install --prefix "$RUNNER_TEMP/lingtong-cli-smoke" "$tarball" --no-audit --no-fund
          installed_version=$("$RUNNER_TEMP/lingtong-cli-smoke/node_modules/.bin/lingtong-cli" --version)
          test "$installed_version" = "lingtong-cli version $RELEASE_VERSION"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish tested npm tarball
        if: steps.trigger.outputs.enabled == 'true' && steps.plan.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          NPM_DIST_TAG: ${{ steps.plan.outputs.npmTag }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Missing repository Actions secret NPM_TOKEN"
            exit 1
          fi
          npm publish "$TARBALL" --access public --tag "$NPM_DIST_TAG" --registry https://registry.npmjs.org

      - name: Wait for npm registry propagation
        if: steps.trigger.outputs.enabled == 'true' && steps.plan.outputs.published != 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: node "$RUNNER_TEMP/lingtong-release.js" wait-published

      - name: Release summary
        if: always() && steps.plan.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          ALREADY_PUBLISHED: ${{ steps.plan.outputs.published }}
          RELEASE_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Release $RELEASE_TAG"
            echo "- 工作流状态：$RELEASE_STATUS"
            echo "- 执行前版本已发布：$ALREADY_PUBLISHED（为 true 时跳过重复发布）"
            echo "- GitHub: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            echo "- npm: https://www.npmjs.com/package/@lingtong-cli/cli/v/$RELEASE_VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
