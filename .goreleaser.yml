version: 2

release:
  use_existing_draft: true
  replace_existing_artifacts: true
  make_latest: "{{ .Env.RELEASE_MAKE_LATEST }}"

builds:
  - binary: lingtong-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/lingtong/cli/internal/build.Version={{ .Version }}
      - -X github.com/lingtong/cli/internal/build.Date={{ .Date }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "lingtong-cli-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
